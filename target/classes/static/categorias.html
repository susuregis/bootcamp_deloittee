<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Deloitte</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html" style="font-size: 2rem; font-weight: bold; color: #000000;">
                Deloitte<span style="color: #86BC25; font-size: 2.5rem;">.</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html"><i class="bi bi-box"></i> Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="categorias.html"><i class="bi bi-tags"></i> Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="fornecedores.html"><i class="bi bi-truck"></i> Fornecedores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pecas.html"><i class="bi bi-gear"></i> Peças</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header" style="background: linear-gradient(135deg, #86BC25 0%, #6da31f 100%);">
        <div class="container">
            <h1><i class="bi bi-tags"></i> Gestão de Categorias</h1>
            <p class="lead mb-0">Cadastro e controle de categorias</p>
        </div>
    </div>

    <!-- Alert Container -->
    <div class="container-fluid mt-3">
        <div id="alertContainer"></div>
    </div>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gerenciar Categorias</h2>
            <button class="btn btn-success" onclick="openCreateModal()">
                <i class="bi bi-plus-circle"></i> Nova Categoria
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center my-5" style="display: none;">
            <div class="spinner-border" style="color: #86BC25;" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Produtos</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="categoriasTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="categoriaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success">
                    <h5 class="modal-title" id="modalTitle">Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoriaForm">
                        <input type="hidden" id="categoriaId">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="saveCategoria()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Bootcamp Java - Deloitte</p>
            <p class="mb-0 mt-2">
                <small>Desenvolvido por Suelen Regina</small>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/categorias.js"></script>
</body>
</html>
