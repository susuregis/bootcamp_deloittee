<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peças - Deloitte</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html" style="font-size: 2rem; font-weight: bold; color: #000000;">
                Deloitte<span style="color: #86BC25; font-size: 2.5rem;">.</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html"><i class="bi bi-box"></i> Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="categorias.html"><i class="bi bi-tags"></i> Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="fornecedores.html"><i class="bi bi-truck"></i> Fornecedores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="pecas.html"><i class="bi bi-gear"></i> Peças</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-header" style="background: linear-gradient(135deg, #86BC25 0%, #6da31f 100%);">
        <div class="container">
            <h1><i class="bi bi-gear-fill"></i> Gestão de Peças</h1>
            <p class="lead mb-0">Controle de peças e estoque</p>
        </div>
    </div>

    <div class="container">
        <div id="alertContainer"></div>
    </div>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Lista de Peças</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#pecaModal" onclick="openCreateModal()" style="background-color: #86BC25; border-color: #86BC25;">
                <i class="bi bi-plus-circle"></i> Nova Peça
            </button>
        </div>

        <div id="loading" class="text-center my-5" style="display: none;">
            <div class="spinner-border spinner-border-custom" style="color: #86BC25;" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Preço</th>
                            <th>Categoria</th>
                            <th>Fornecedor</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pecasTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="pecaModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalTitle">Nova Peça</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="pecaForm">
                        <input type="hidden" id="pecaId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nome" class="form-label">Nome *</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="preco" class="form-label">Preço *</label>
                                <input type="number" class="form-control" id="preco" step="0.01" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categoriaId" class="form-label">Categoria *</label>
                                <select class="form-select" id="categoriaId" required>
                                    <option value="">Selecione...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fornecedorId" class="form-label">Fornecedor *</label>
                                <select class="form-select" id="fornecedorId" required>
                                    <option value="">Selecione...</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="savePeca()" style="background-color: #86BC25; border-color: #86BC25;">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Bootcamp Java - Deloitte</p>
            <p class="mb-0 mt-2">
                <small>Desenvolvido por Suelen Regina</small>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pecas.js"></script>
</body>
</html>
