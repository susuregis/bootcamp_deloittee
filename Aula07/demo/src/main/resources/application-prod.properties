
# ============================================
# AZURE PRODUCTION CONFIGURATION
# ============================================

# Server Configuration (Azure requer porta 8080)
server.port=8080

# Database H2 - Persistente em arquivo
spring.datasource.url=jdbc:h2:file:./data/bootcamp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console desabilitado em produção (segurança)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# Logging mínimo para produção
logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/application.log

# Não incluir stacktrace em erros
server.error.include-stacktrace=never
server.error.include-exception=false

# Desabilitar Swagger em produção (opcional)
springdoc.swagger-ui.enabled=false
